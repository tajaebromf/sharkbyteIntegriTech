<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; padding: 10px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    button { width: 220px; padding: 8px 12px; border-radius: 10px; border: none; cursor: pointer; }
    .primary { background: #111; color: #fff; }
    .ghost { background: #f2f2f2; margin-top: 8px; }
    small { display: block; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <button id="toggle" class="primary">Toggle Sidebar</button>
  <button id="add" class="ghost">Add Note (Alt+H)</button>
  <small>Tip: select text, then press <b>Alt+H</b>.</small>
  <script src="popup.js"></script>
</body>
</html>
